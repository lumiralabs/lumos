[project]
name = "lumira-lumos"
version = "0.0.4"
description = ""
authors = [
    {name = "Arun Patro", email = "arun@lumiralabs.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fire>=0.7.0",
    "pydantic>=2.10.5",
    "litellm>=1.58.2",
    "uvicorn>=0.34.0",
    "rich>=13.9.4",
    "fastapi>=0.115.6",
    "structlog>=25.1.0",
    "python-magic>=0.4.27",
    "pymupdf>=1.25.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "pre-commit>=4.0.1",
    "pytest>=8.3.4"
]
book = [
    "unstructured[pdf]>=0.16.13",
    # torch/torchvision are pulled in by unstructured[pdf]; listed here
    # so the pytorch-cpu source override below applies to them.
    "torch>=2.0",
    "torchvision",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumos"]

# ── CPU-only torch on Linux ───────────────────────────────────────
# On Linux (our Docker runtime) pull torch/torchvision from PyTorch's
# CPU wheel index. On macOS (local dev) keep the default so MPS works.
# This avoids ~2–4 GB of nvidia-cuda-* transitive deps in our image.
[tool.uv.sources]
torch       = [{ index = "pytorch-cpu", marker = "platform_system == 'Linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "platform_system == 'Linux'" }]

[[tool.uv.index]]
name     = "pytorch-cpu"
url      = "https://download.pytorch.org/whl/cpu"
explicit = true


[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "mkdocs-material>=9.6.5",
    "pre-commit>=4.0.1",
    "pydantic-ai>=0.0.24",
    "pytest>=8.3.4",
]
book = [
    "unstructured[pdf]>=0.16.13",
    # torch/torchvision are pulled in by unstructured[pdf]; listed here
    # so the pytorch-cpu source override below applies to them.
    "torch>=2.0",
    "torchvision",
]
